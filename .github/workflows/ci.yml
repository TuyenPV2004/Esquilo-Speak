name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-compatibility:
    name: Check contract compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch pull request base
        run: git fetch --depth=1 origin "${{ github.base_ref }}"

      - name: Detect breaking OpenAPI changes
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: "origin/${{ github.base_ref }}:contracts/openapi/esquilospeak-learning-v1.yaml"
          revision: "HEAD:contracts/openapi/esquilospeak-learning-v1.yaml"
          fail-on: WARN
          review: false

  validate-contracts:
    name: Validate contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate JSON files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const directory = path.join('contracts', 'schema');
          const files = fs
            .readdirSync(directory)
            .filter((file) => file.endsWith('.json'))
            .sort();

          if (files.length === 0) {
            throw new Error(`No JSON files found in ${directory}`);
          }

          for (const file of files) {
            const filePath = path.join(directory, file);
            JSON.parse(fs.readFileSync(filePath, 'utf8'));
            console.log(`Validated ${filePath}`);
          }
          NODE

      - name: Validate P0 release freeze and Android fixtures
        run: node tests/contract/Validate_P0_Release_Freeze.mjs

      - name: Lint OpenAPI contract
        run: >-
          npx --yes @redocly/cli@2.39.0 lint
          contracts/openapi/esquilospeak-learning-v1.yaml
          --extends=spec

  backend:
    name: Build and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/core-platform

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Build and test
        run: ./gradlew test bootJar

  mobile:
    name: Analyze, test, and build mobile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.3"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

  infrastructure:
    name: Validate local infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose model
        env:
          POSTGRES_PASSWORD: ci-placeholder-only
        run: >-
          docker compose
          -f infrastructure/local/compose/compose.yml
          config --quiet

  android-end-to-end:
    name: Android end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ESQUILO_DB_URL: jdbc:postgresql://localhost:5432/esquilospeak
      ESQUILO_DB_USERNAME: esquilospeak
      ESQUILO_DB_PASSWORD: e2e-only-password
      SPRING_CONFIG_IMPORT: optional:classpath:/

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: esquilospeak
          POSTGRES_USER: esquilospeak
          POSTGRES_PASSWORD: e2e-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esquilospeak -d esquilospeak"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.3"
          channel: stable
          cache: true

      - name: Resolve mobile packages
        working-directory: apps/mobile
        run: flutter pub get

      - name: Start backend
        working-directory: backend/core-platform
        run: |
          ./gradlew bootRun > backend-e2e.log 2>&1 &
          echo $! > backend-e2e.pid

      - name: Wait for backend readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health/readiness > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat backend/core-platform/backend-e2e.log
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run learning journey on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7_pro
          script: >-
            cd apps/mobile &&
            flutter test integration_test/learning_flow_integration_test.dart
            -d emulator-5554
