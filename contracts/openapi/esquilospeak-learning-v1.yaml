openapi: 3.1.1
info:
  title: EsquiloSpeak Learning API
  version: 0.2.0
  description: >-
    Mobile contract for identity/profile onboarding and the first learning
    vertical slice: resolve a guest or account learner, manage profile and
    consent, merge guest progress, request privacy workflows, discover a
    course, load a lesson, submit an attempt, receive feedback, and read
    progress. Account authentication remains owned by an external OIDC
    provider; mastery scheduling remains outside this version.
  contact:
    name: EsquiloSpeak
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Catalog
  - name: Identity
  - name: Profile
  - name: Consent
  - name: Privacy
  - name: Learning
  - name: Progress
paths:
  /api/mobile/v1/languages:
    get:
      tags: [Catalog]
      operationId: listLearningLanguages
      summary: List enabled learning languages
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Enabled languages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../schema/language.schema.json
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/mobile/v1/courses:
    get:
      tags: [Catalog]
      operationId: listCourses
      summary: List published courses for a language pair
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: sourceLanguage
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Locale'
        - name: targetLanguage
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Locale'
      responses:
        '200':
          description: Matching published courses
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../schema/course.schema.json
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/mobile/v1/courses/{courseId}/lessons:
    get:
      tags: [Catalog]
      operationId: listCourseLessons
      summary: List published lesson versions in course order
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Ordered lesson summaries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LessonSummary'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/mobile/v1/lessons/{lessonId}:
    get:
      tags: [Learning]
      operationId: getLesson
      summary: Get an immutable published lesson version
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/LessonId'
        - name: version
          in: query
          required: false
          description: Omit to resolve the current published version.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Lesson content
          headers:
            ETag:
              description: Entity tag for local caching.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../schema/lesson-delivery.schema.json
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/mobile/v1/attempts:
    post:
      tags: [Learning]
      operationId: submitAttempt
      summary: Submit one append-only exercise attempt
      description: >-
        The server deduplicates retries by Idempotency-Key and clientAttemptId.
        Repeating the same accepted request returns the canonical result without
        creating another attempt.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptRequest'
      responses:
        '200':
          description: Canonical attempt result and updated progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Idempotency key reused with a different request payload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/mobile/v1/progress/courses/{courseId}:
    get:
      tags: [Progress]
      operationId: getCourseProgress
      summary: Get canonical progress for the current learner
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Course progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseProgress'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/mobile/v1/me/profile:
    get:
      tags: [Profile]
      operationId: getLearnerProfile
      summary: Get the current guest or account learner profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current learner profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerProfile'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    put:
      tags: [Profile]
      operationId: replaceLearnerProfile
      summary: Complete or replace profile and onboarding choices
      description: >-
        Account learners must complete an age band before learning data can be
        synchronized. Under-16 accounts require a separately approved guardian
        consent flow and are rejected in P0.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated learner profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerProfile'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/mobile/v1/me/consents:
    get:
      tags: [Consent]
      operationId: listCurrentConsents
      summary: List the latest record for every consent purpose
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current consent records
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsentRecord'
                additionalProperties: false
        '401':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/mobile/v1/me/consents/{purpose}:
    put:
      tags: [Consent]
      operationId: recordConsent
      summary: Append a versioned consent decision
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: purpose
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ConsentPurpose'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentUpdate'
      responses:
        '200':
          description: Recorded consent decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/mobile/v1/me/guest-merge-tickets:
    post:
      tags: [Identity]
      operationId: createGuestMergeTicket
      summary: Create a short-lived one-time guest merge ticket
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '201':
          description: One-time merge ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestMergeTicket'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/mobile/v1/me/guest-merges:
    post:
      tags: [Identity]
      operationId: mergeGuestIntoAccount
      summary: Merge guest learning data into the current account
      description: >-
        Authenticate as the account learner. Repeating the same request with
        the same Idempotency-Key returns the canonical merge result.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mergeTicket]
              properties:
                mergeTicket:
                  type: string
                  minLength: 1
                  maxLength: 200
              additionalProperties: false
      responses:
        '200':
          description: Canonical merge result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestMergeResult'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/mobile/v1/me/privacy/exports:
    post:
      tags: [Privacy]
      operationId: requestAccountExport
      summary: Request an asynchronous machine-readable account export
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Export request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyRequest'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/mobile/v1/me/privacy/deletions:
    post:
      tags: [Privacy]
      operationId: requestAccountDeletion
      summary: Request account deletion and immediately restrict the learner
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Deletion request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyRequest'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/mobile/v1/me/privacy/requests/{requestId}:
    get:
      tags: [Privacy]
      operationId: getPrivacyRequest
      summary: Get a privacy request owned by the current learner
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/PrivacyRequestId'
      responses:
        '200':
          description: Current request state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyRequest'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        External OIDC account token or local-development guest token. Protected
        mobile operations require the learning scope and learner role; the
        actor_type claim must be guest or account.
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: >-
        Caller-provided correlation identifier. Invalid or omitted values are
        replaced by the server and the canonical value is returned in the
        response header and error traceId.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'
        maxLength: 64
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable UUID generated once for the logical mutation.
      schema:
        type: string
        format: uuid
    PrivacyRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ErrorResponse:
      description: Request could not be completed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Identifier:
      type: string
      pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'
      minLength: 2
      maxLength: 100
    Locale:
      type: string
      pattern: '^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$'
      examples: [vi, en, pt-BR]
    AgeBand:
      type: string
      enum: [under_16, 16_17, adult]
    ActorType:
      type: string
      enum: [guest, account]
    LearnerProfile:
      type: object
      required:
        - learnerId
        - actorType
        - uiLocale
        - sourceLanguage
        - targetLanguage
        - preferences
        - updatedAt
      properties:
        learnerId:
          type: string
          format: uuid
        actorType:
          $ref: '#/components/schemas/ActorType'
        uiLocale:
          $ref: '#/components/schemas/Locale'
        sourceLanguage:
          $ref: '#/components/schemas/Locale'
        targetLanguage:
          $ref: '#/components/schemas/Locale'
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        learningGoal:
          type: string
          maxLength: 50
        preferences:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    ProfileUpdate:
      type: object
      required:
        - uiLocale
        - sourceLanguage
        - targetLanguage
        - ageBand
      properties:
        uiLocale:
          $ref: '#/components/schemas/Locale'
        sourceLanguage:
          $ref: '#/components/schemas/Locale'
        targetLanguage:
          $ref: '#/components/schemas/Locale'
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        learningGoal:
          type: string
          maxLength: 50
        preferences:
          type: object
          additionalProperties: true
      additionalProperties: false
    ConsentPurpose:
      type: string
      enum:
        - required_service
        - operational_telemetry
        - marketing_notifications
    ConsentUpdate:
      type: object
      required: [policyVersion, granted]
      properties:
        policyVersion:
          type: string
          minLength: 1
          maxLength: 50
        granted:
          type: boolean
      additionalProperties: false
    ConsentRecord:
      type: object
      required: [purpose, policyVersion, granted, recordedAt]
      properties:
        purpose:
          $ref: '#/components/schemas/ConsentPurpose'
        policyVersion:
          type: string
          minLength: 1
          maxLength: 50
        granted:
          type: boolean
        recordedAt:
          type: string
          format: date-time
      additionalProperties: false
    GuestMergeTicket:
      type: object
      required: [mergeTicket, expiresAt]
      properties:
        mergeTicket:
          type: string
          minLength: 1
          maxLength: 200
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    GuestMergeResult:
      type: object
      required: [guestLearnerId, accountLearnerId, mergedAt]
      properties:
        guestLearnerId:
          type: string
          format: uuid
        accountLearnerId:
          type: string
          format: uuid
        mergedAt:
          type: string
          format: date-time
      additionalProperties: false
    PrivacyRequest:
      type: object
      required:
        - requestId
        - requestType
        - state
        - requestedAt
        - targetAt
      properties:
        requestId:
          type: string
          format: uuid
        requestType:
          type: string
          enum: [export, deletion]
        state:
          type: string
          enum: [requested, processing, completed, failed]
        requestedAt:
          type: string
          format: date-time
        targetAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        artifact:
          type: object
          additionalProperties: true
        artifactExpiresAt:
          type: string
          format: date-time
        failureCode:
          type: string
          maxLength: 80
      additionalProperties: false
    LocalizedText:
      type: object
      minProperties: 1
      patternProperties:
        '^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$':
          type: string
          minLength: 1
      additionalProperties: false
    LessonSummary:
      type: object
      required: [id, version, title, estimatedMinutes]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        version:
          type: integer
          minimum: 1
        title:
          $ref: '#/components/schemas/LocalizedText'
        estimatedMinutes:
          type: integer
          minimum: 1
          maximum: 120
      additionalProperties: false
    AttemptRequest:
      type: object
      required:
        - clientAttemptId
        - courseId
        - lessonId
        - lessonVersion
        - exerciseId
        - selectedOptionId
        - occurredAt
      properties:
        clientAttemptId:
          type: string
          format: uuid
        courseId:
          $ref: '#/components/schemas/Identifier'
        lessonId:
          $ref: '#/components/schemas/Identifier'
        lessonVersion:
          type: integer
          minimum: 1
        exerciseId:
          $ref: '#/components/schemas/Identifier'
        selectedOptionId:
          $ref: '#/components/schemas/Identifier'
        occurredAt:
          type: string
          format: date-time
        responseTimeMs:
          type: integer
          minimum: 0
      additionalProperties: false
    AttemptResult:
      type: object
      required:
        - attemptId
        - clientAttemptId
        - acceptedAt
        - correct
        - feedback
        - progress
        - syncCursor
      properties:
        attemptId:
          type: string
          format: uuid
        clientAttemptId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
        correct:
          type: boolean
        feedback:
          $ref: '#/components/schemas/Feedback'
        progress:
          $ref: '#/components/schemas/CourseProgress'
        syncCursor:
          type: string
          minLength: 1
      additionalProperties: false
    Feedback:
      type: object
      required: [message, correctOptionId, explanation]
      properties:
        message:
          $ref: '#/components/schemas/LocalizedText'
        correctOptionId:
          $ref: '#/components/schemas/Identifier'
        explanation:
          $ref: '#/components/schemas/LocalizedText'
      additionalProperties: false
    CourseProgress:
      type: object
      required:
        - courseId
        - completedExerciseCount
        - totalExerciseCount
        - lastActivityAt
        - lessonProgress
      properties:
        courseId:
          $ref: '#/components/schemas/Identifier'
        completedExerciseCount:
          type: integer
          minimum: 0
        totalExerciseCount:
          type: integer
          minimum: 0
        lastActivityAt:
          type: string
          format: date-time
        lessonProgress:
          type: array
          items:
            $ref: '#/components/schemas/LessonProgress'
      additionalProperties: false
    LessonProgress:
      type: object
      required: [lessonId, lessonVersion, status, completedExerciseCount, totalExerciseCount]
      properties:
        lessonId:
          $ref: '#/components/schemas/Identifier'
        lessonVersion:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [not_started, in_progress, completed]
        completedExerciseCount:
          type: integer
          minimum: 0
        totalExerciseCount:
          type: integer
          minimum: 1
      additionalProperties: false
    ApiError:
      type: object
      required: [type, title, status, code, traceId, retryable]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]+$'
        traceId:
          type: string
          minLength: 1
        retryable:
          type: boolean
        violations:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string
            additionalProperties: false
      additionalProperties: false
